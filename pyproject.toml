[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "infertrace"
version = "0.1.0rc1"
description = "Low-overhead AI inference observability"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "opentelemetry-api>=1.25,<2",
  "opentelemetry-sdk>=1.25,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "prometheus-client>=0.21,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.17.1", "mypy==2.4.0", "build==1.6.1"]

[tool.setuptools.packages.find]
include = ["infertrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["infertrace"]

[tool.setuptools.package-data]
infertrace = ["static/*.html", "static/*.js", "py.typed"]
