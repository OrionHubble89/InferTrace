name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -c constraints.txt -e '.[dev]'
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest -q
      - run: python -m build --wheel

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -c constraints.txt -e .
      - run: npm ci --ignore-scripts
      - run: npm run test:ui
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e .
      - run: docker compose --profile mock config --quiet
      - run: docker compose --profile mock up --build -d infertrace otel-collector jaeger mock
      - run: docker compose --profile mock run --rm demo
      - run: python scripts/compose_smoke.py
      - if: always()
        run: docker compose --profile mock logs
      - if: always()
        run: docker compose --profile mock down -v
